name: Telegram Connection Test

on:
  workflow_dispatch:

permissions: {}

jobs:
  send-test-message:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send one Telegram test message
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: |
          set -euo pipefail
          test -n "${TELEGRAM_TOKEN:-}" || { echo "TELEGRAM_TOKEN is not configured"; exit 1; }
          test -n "${TELEGRAM_CHAT:-}" || { echo "TELEGRAM_CHAT is not configured"; exit 1; }
          payload='{"chat_id":"'"$TELEGRAM_CHAT"'","text":"✅ اختبار اتصال MaYor Cloud Pro: Telegram يعمل من مستودع Hanachi04/mayor-engine.","disable_web_page_preview":true}'
          response="$(curl --fail-with-body --silent --show-error --max-time 20 \
            --request POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --header 'Content-Type: application/json' \
            --data "$payload")"
          printf '%s\n' "$response" | grep -q '"ok":true'
          echo "Telegram test message delivered"
