name: MaYor Monthly Performance Report

on:
  schedule:
    # أول يوم من كل شهر عند 05:00 بتوقيت الرياض؛ التقرير يغطي آخر 30 يومًا.
    - cron: '0 2 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mayor-cloud-pro-mtf
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate and send monthly report
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: npm run report:monthly

      - name: Save monthly report
        env:
          GH_BRANCH: ${{ github.ref_name }}
        run: |
          set -u
          git config user.name "mayor-bot"
          git config user.email "mayor-bot@users.noreply.github.com"
          git add data/reports/monthly.json
          if git diff --cached --quiet; then
            echo "لا تغيير في التقرير الشهري"
            exit 0
          fi
          git commit -m "save monthly performance report ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          branch="${GH_BRANCH:-main}"
          for attempt in 1 2 3; do
            if git fetch origin "$branch" && git pull --rebase origin "$branch" && git push origin "HEAD:$branch"; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          exit 1
