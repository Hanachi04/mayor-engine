# FROZEN / STOPPED with MaYor product line — manual only
name: MaYor Weekly Performance Report

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mayor-cloud-pro-mtf
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate and send weekly report
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: npm run report:weekly

      - name: Save weekly report
        env:
          GH_BRANCH: ${{ github.ref_name }}
        run: |
          set -u
          git config user.name "mayor-bot"
          git config user.email "mayor-bot@users.noreply.github.com"
          git add data/reports/weekly.json
          if git diff --cached --quiet; then
            echo "لا تغيير في التقرير الأسبوعي"
            exit 0
          fi
          git commit -m "save weekly performance report ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          branch="${GH_BRANCH:-main}"
          pushed=0
          for attempt in 1 2 3; do
            echo "Push attempt $attempt/3"
            git pull --rebase --autostash origin "$branch" || { echo 'rebase conflict'; git rebase --abort; exit 1; }
            if git push origin "HEAD:$branch"; then pushed=1; break; fi
            sleep 5
          done
          if [ "$pushed" != 1 ]; then
            echo "push failed after 3 attempts"
            exit 1
          fi
