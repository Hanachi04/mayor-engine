# FROZEN / STOPPED with MaYor product line — manual only
name: MaYor Weekly Performance Report

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mayor-cloud-pro-mtf
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate and send weekly report
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: npm run report:weekly

      - name: Save weekly report
        env:
          GH_BRANCH: ${{ github.ref_name }}
        run: |
          set -u
          git config user.name "mayor-bot"
          git config user.email "mayor-bot@users.noreply.github.com"
          git add data/reports/weekly.json
          if git diff --cached --quiet; then
            echo "لا تغيير في التقرير الأسبوعي"
            exit 0
          fi
          git commit -m "save weekly performance report ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          branch="${GH_BRANCH:-main}"
          for attempt in 1 2 3; do
            if git fetch origin "$branch" && git pull --rebase origin "$branch" && git push origin "HEAD:$branch"; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          exit 1
