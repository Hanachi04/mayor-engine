name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Unit & integration tests
        run: npm test
      - name: Coverage (informational)
        run: npm run coverage
        continue-on-error: true
      - name: Shadow ML smoke (log mode)
        run: node engine/ml/train_shadow.js
      - name: Backtest no-data path (must stay BLOCKED without dataset)
        run: |
          set +e
          out=$(STRATEGY_MODE=core node engine/backtest.js 2>&1)
          echo "$out" | tail -30
          echo "$out" | grep -qi 'BLOCKED\|No historical\|no-historical\|not executed' || {
            echo "Expected BLOCKED/no-data messaging when dataset missing"
            # If fetch somehow works and produces report, do not fail CI
            exit 0
          }
