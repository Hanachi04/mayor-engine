name: CI

# BUDGET: ignore routine data/docs bot commits so scanner/report pushes do not re-run full CI.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'forward-test/**'
      - 'docs/STATUS.md'
      - '**.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit & integration tests
        run: npm test
      - name: Coverage (informational)
        run: npm run coverage
        continue-on-error: true
      - name: Shadow ML smoke (log mode)
        run: node engine/ml/train_shadow.js
      - name: Backtest no-data path must remain BLOCKED
        env:
          BACKTEST_FETCH: '0'
          BACKTEST_SYMBOLS: BTCUSDT
          MAYOR_STATE_DIR: ${{ runner.temp }}/mayor-state
        run: |
          set -euo pipefail
          out=$(STRATEGY_MODE=core node engine/backtest.js 2>&1)
          echo "$out" | tail -30
          echo "$out" | grep -q '"status": "BLOCKED"' || {
            echo "Expected the backtest report to remain BLOCKED without historical data"
            exit 1
          }
