name: Futures Scalper v1

on:
  schedule:
    - cron: '7/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'DRY_RUN (log only, no Telegram / no tracked write)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: futures-scalper-v1
  cancel-in-progress: false

jobs:
  scalper:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Existing MaYor unit tests (must stay green)
        run: npm test

      - name: Scalper unit tests
        run: node test/scalper/unit.test.js

      - name: Run Futures Scalper
        env:
          SCALPER_TELEGRAM_TOKEN: ${{ secrets.SCALPER_TELEGRAM_TOKEN }}
          SCALPER_TELEGRAM_CHAT: ${{ secrets.SCALPER_TELEGRAM_CHAT }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          SCALPER_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          SCALPER_VERIFICATION_GATE_MODE: 'warn'
          SCALPER_MAX_SIGNALS_PER_DAY: '30'
          SCALPER_COOLDOWN_MINUTES: '3'
          SCALPER_MAX_OPEN: '4'
          SCALPER_MAX_TRADE_AGE_MINUTES: '25'
          SCALPER_ATR_SL_MULT: '1.1'
          SCALPER_MIN_RR: '1.5'
          SCALPER_RISK_PER_TRADE_PCT: '0.35'
          SCALPER_MIN_QUOTE_VOLUME_24H: '20000000'
        run: node engine/scalper/scan.js

      - name: Commit scalper data (rebase + retry)
        if: always()
        env:
          GH_BRANCH: ${{ github.ref_name }}
        run: |
          set -u
          git config user.name "scalper-bot"
          git config user.email "scalper-bot@users.noreply.github.com"
          for file in data/scalper/tracked.json data/scalper/verification.json data/scalper/heartbeat.json data/scalper/backtest_report.json; do
            if [ -e "$file" ]; then git add "$file"; fi
          done
          if git diff --cached --quiet; then
            echo "No scalper data changes"
            exit 0
          fi
          git commit -m "scalper: update tracked/heartbeat ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          branch="${GH_BRANCH:-main}"
          for attempt in 1 2 3; do
            echo "Push attempt $attempt/3"
            if git fetch origin "$branch" && git pull --rebase origin "$branch" && git push origin "HEAD:$branch"; then
              echo "✓ scalper data pushed"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 4))
          done
          echo "✗ push failed after 3 attempts"
          exit 1
