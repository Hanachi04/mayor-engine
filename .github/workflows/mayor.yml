# FROZEN / STOPPED: MaYor Cloud Pro MTF — manual only, not for live
name: MaYor Cloud Pro MTF

# BUDGET: was every 3 hours (~8/day + CI cascade on each commit).
# Now once daily 12:00 UTC + manual.
on:
  workflow_dispatch:
    inputs:
      run_verification:
        description: 'تشغيل backtest وMonte Carlo/OOS قبل المسح'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

# يمنع تشغيلين متوازيين من تعديل tracked.json في الوقت نفسه.
concurrency:
  group: mayor-cloud-pro-mtf
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Unit tests
        run: npm test

      - name: Historical verification (manual only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_verification == true }}
        env:
          BACKTEST_FETCH: '0'
          MONTE_CARLO_RUNS: '1000'
        run: npm run verify

      - name: Run signal scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          MAX_SIGNALS_PER_DAY: '8'
          SIGNAL_SLOT_HOURS: '3'
          SIGNAL_COOLDOWN_MINUTES: '60'
          MIN_QUOTE_VOLUME_24H: '5000000'
          VERIFICATION_GATE_MODE: 'enforce'
          TAKER_FEE_RATE: '0.0005'
          SLIPPAGE_RATE: '0.0002'
          ACCOUNT_CAPITAL: '1000'
          RISK_PER_TRADE_PCT: '1'
          LEVERAGE: '1'
          MAX_NOTIONAL_MULTIPLE: '1'
          REQUEST_TIMEOUT_MS: '12000'
          REQUEST_RETRIES: '3'
          # --- إعدادات الدمج الموحّد (v3.0) — القيم الافتراضية تحافظ على السلوك القديم تمامًا ---
          STRATEGY_MODE: 'core'            # core (v2.1 simplified) | balanced | momentum | breakout
          MIN_CORE_PCT: '50'
          MIN_MTF_PCT: '60'
          MIN_ADX: '16'
          SENTIMENT_ENABLED: '1'           # 0 لإيقاف مؤشر الخوف والجشع كمصدر تصويت تكميلي
          MAX_DAILY_LOSS_PCT: '4'          # إيقاف إشارات جديدة بعد خسارة يومية 4%
          MAX_LOSS_STREAK: '4'             # إيقاف إشارات جديدة بعد 4 خسائر متتالية
          ADAPTATION_ENABLED: '1'
          ADAPT_LOOKBACK_TRADES: '8'
          ADAPT_MIN_TRADES: '6'
          ADAPT_MIN_PF: '0.85'
          ADAPT_MAX_NET_PCT: '-3'
          ADAPT_BAN_HOURS: '72'
          ADAPT_MAX_NEW_BANS: '3'
          ML_SHADOW_MODE: 'log'          # log | filter | off — لا تفعّل filter قبل مراجعة الظل
          BLOCK_UTC_HOURS: ''             # فارغ=معطّل؛ لا تحظر ساعة بعينة صغيرة (مثال: 18)
        run: node engine/scan.js

      - name: Commit tracking data with rebase and retry
        if: always()
        env:
          GH_BRANCH: ${{ github.ref_name }}
        run: |
          set -u
          git config user.name "mayor-bot"
          git config user.email "mayor-bot@users.noreply.github.com"
          for file in data/tracked.json data/backtest_report.json data/verification.json data/circuit_breaker.json; do
            if [ -e "$file" ]; then
              git add "$file"
            fi
          done
          if git diff --cached --quiet; then
            echo "لا تغييرات في tracked.json"
            exit 0
          fi
          git commit -m "update tracked signals ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          branch="${GH_BRANCH:-main}"
          pushed=0
          for attempt in 1 2 3; do
            echo "Push attempt $attempt/3"
            git pull --rebase --autostash origin "$branch" || { echo 'rebase conflict'; git rebase --abort; exit 1; }
            if git push origin "HEAD:$branch"; then pushed=1; break; fi
            sleep 5
          done
          if [ "$pushed" != 1 ]; then
            echo "✗ تعذر دفع tracked.json بعد 3 محاولات"
            exit 1
          fi
