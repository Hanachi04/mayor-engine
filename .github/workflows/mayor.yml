name: MaYor Signal Engine

on:
  schedule:
    - cron: '*/30 * * * *'   # كل 30 دقيقة
  workflow_dispatch:         # + تشغيل يدوي عند الحاجة

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run signal scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
          SYMBOLS: ${{ vars.SYMBOLS }}
        run: node engine/scan.js

      - name: Commit updated tracking data back to repo
        run: |
          git config user.name "mayor-bot"
          git config user.email "mayor-bot@users.noreply.github.com"
          git add data/tracked.json
          git commit -m "update tracked signals ($(date -u))" || echo "no changes"
          git push
