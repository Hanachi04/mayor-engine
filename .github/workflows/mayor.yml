name: MaYor Cloud Pro MTF

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      run_verification:
        description: 'تشغيل backtest وMonte Carlo/OOS قبل المسح'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

# يمنع تشغيلين متوازيين من تعديل tracked.json في الوقت نفسه.
concurrency:
  group: mayor-cloud-pro-mtf
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Unit tests
        run: npm test

      - name: Historical verification (manual only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_verification == true }}
        env:
          BACKTEST_FETCH: '0'
          MONTE_CARLO_RUNS: '1000'
        run: npm run verify

      - name: Run signal scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          MAX_SIGNALS_PER_DAY: '8'
          SIGNAL_SLOT_HOURS: '3'
          SIGNAL_COOLDOWN_MINUTES: '60'
          MIN_QUOTE_VOLUME_24H: '5000000'
          VERIFICATION_GATE_MODE: 'warn'
          TAKER_FEE_RATE: '0.0005'
          SLIPPAGE_RATE: '0.0002'
          ACCOUNT_CAPITAL: '1000'
          RISK_PER_TRADE_PCT: '1'
          LEVERAGE: '1'
          MAX_NOTIONAL_MULTIPLE: '1'
          REQUEST_TIMEOUT_MS: '12000'
          REQUEST_RETRIES: '3'
          # --- إعدادات الدمج الموحّد (v3.0) — القيم الافتراضية تحافظ على السلوك القديم تمامًا ---
          STRATEGY_MODE: 'balanced'        # balanced | momentum | breakout
          SENTIMENT_ENABLED: '1'           # 0 لإيقاف مؤشر الخوف والجشع كمصدر تصويت تكميلي
          MAX_DAILY_LOSS_PCT: '0'          # مثال: 5  → إيقاف إشارات جديدة بعد خسارة يومية 5%. 0 = معطّل
          MAX_LOSS_STREAK: '0'             # مثال: 4  → إيقاف إشارات جديدة بعد 4 خسائر متتالية. 0 = معطّل
        run: node engine/scan.js

      - name: Commit tracking data with rebase and retry
        if: always()
        env:
          GH_BRANCH: ${{ github.ref_name }}
        run: |
          set -u
          git config user.name "mayor-bot"
          git config user.email "mayor-bot@users.noreply.github.com"
          for file in data/tracked.json data/backtest_report.json data/verification.json data/circuit_breaker.json; do
            if [ -e "$file" ]; then
              git add "$file"
            fi
          done
          if git diff --cached --quiet; then
            echo "لا تغييرات في tracked.json"
            exit 0
          fi
          git commit -m "update tracked signals ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          branch="${GH_BRANCH:-main}"
          for attempt in 1 2 3; do
            echo "محاولة الدفع $attempt/3"
            if git fetch origin "$branch" && git pull --rebase origin "$branch" && git push origin "HEAD:$branch"; then
              echo "✓ تم دفع tracked.json"
              exit 0
            fi
            echo "تعذر الدفع؛ إلغاء rebase قبل إعادة المحاولة"
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "✗ تعذر دفع tracked.json بعد 3 محاولات"
          exit 1
